[project]
name = "paperboy"
version = "0.0.0"
description = "Local read-only Telegram channel OSINT collector"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "telethon==1.44.*",
  "typer>=0.12",
  "pydantic-settings>=2.4",
  "keyring>=25",
  "httpx>=0.27",
  "structlog>=24",
  "rich>=13",
  "pysocks>=1.7",
]

[project.scripts]
paperboy = "paperboy.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperboy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]   # lets `from tests.fakes import ...` resolve

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
